<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher A · Still</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Inter+Tight:wght@600&family=Roboto:wght@700;900&family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #eef0f6;
    --ink-dim: rgba(238, 240, 246, .55);
    --gold: #ffc81e;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: Manrope, system-ui, sans-serif; color: var(--ink); }

  /* 1920×1080 TV canvas, scaled to fit the browser window */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center; overflow: hidden; background: #040a1e;
  }

  /* Live wallpaper, drifting a little with focus (parallax) */
  .wall {
    position: absolute; inset: -40px -80px;
    filter: brightness(.7) saturate(.95);
    transition: transform 1.6s var(--ease);
  }
  .wall video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top, rgba(4,6,16,.94) 0%, rgba(4,6,16,.6) 30%, rgba(4,6,16,0) 60%),
      linear-gradient(to bottom, rgba(4,6,16,.45) 0%, rgba(4,6,16,0) 22%);
  }
  /* Extra dimming while "Recently seen" is on screen */
  .dim {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(6,7,12,.9) 0%, rgba(6,7,12,.84) 58%, rgba(6,7,12,.55) 100%);
    transition: opacity .7s var(--ease);
  }
  #stage.recent-on .dim { opacity: 1; }

  /* Clock: top-right corner, small and light */
  .clock {
    position: absolute; top: 60px; right: 100px; z-index: 2;
    font-weight: 300; font-size: 30px; letter-spacing: .03em;
    font-variant-numeric: tabular-nums; color: rgba(238,240,246,.8);
  }
  .clock .colon { display: inline-block; margin: 0 1px; opacity: .55; }

  /* ---------- App row, centred ---------- */
  .row {
    position: absolute; left: 50%; top: 700px; transform: translateX(-50%);
    display: flex; gap: 44px; align-items: flex-end;
    transition: opacity .5s var(--ease);
  }
  .tile {
    position: relative; width: 288px; height: 162px; border-radius: 18px;
    overflow: hidden; cursor: pointer;
    opacity: .92; filter: saturate(.5) brightness(.45);
    transform: translateY(0) scale(1);
    transform-origin: bottom center;
    outline: 2px solid rgba(238,240,246,0); outline-offset: 6px;
    transition: opacity .5s var(--ease), filter .5s var(--ease), transform .5s var(--ease), box-shadow .5s var(--ease), outline-color .5s var(--ease);
  }
  .tile.on {
    opacity: 1; filter: none;
    transform: translateY(-6px) scale(1.1);
    outline-color: rgba(238,240,246,.7);
    box-shadow: 0 30px 60px -18px rgba(0,0,0,.85);
  }
  /* While browsing posters, the app keeps its colour but hands the ring to the poster */
  #stage.zone-recent .tile.on { outline-color: rgba(238,240,246,0); transform: translateY(0) scale(1.04); }

  /* Name + position indicator, centred under the row */
  .meta {
    position: absolute; left: 0; right: 0; top: 925px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .name { font-size: 26px; font-weight: 400; letter-spacing: .02em; transition: opacity .25s, transform .4s var(--ease); }
  .name.swap { opacity: 0; transform: translateY(6px); }
  .pips { display: flex; gap: 8px; }
  .pip { width: 6px; height: 6px; border-radius: 3px; background: rgba(238,240,246,.28); transition: width .5s var(--ease), background .5s; }
  .pip.on { width: 24px; background: rgba(238,240,246,.9); }

  /* ---------- Recently seen (moviesNight) ---------- */
  .recent {
    position: absolute; left: 0; right: 0; top: 150px; height: 470px;
    opacity: 0; transform: translateY(18px); pointer-events: none;
    transition: opacity .55s var(--ease), transform .7s var(--ease);
  }
  #stage.recent-on .recent { opacity: 1; transform: none; pointer-events: auto; }

  .info {
    position: absolute; left: 140px; top: 25px; width: 540px; height: 420px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: opacity .2s ease;
  }
  .info.swap { opacity: 0; }
  .kicker { font-size: 14px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 22px; }
  .r-title {
    font-size: 62px; font-weight: 300; line-height: 1.06; letter-spacing: -.015em; padding-bottom: .1em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .r-sub { margin-top: 12px; font-size: 22px; font-weight: 300; letter-spacing: .02em; color: var(--ink-dim); }
  /* Watched date uses the same small-caps style as the "Recently seen" label */
  .r-watched { font-size: 14px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-dim); }
  .stars { display: flex; gap: 6px; margin-top: 18px; }
  .stars svg { width: 36px; height: 36px; }
  /* Recommendation: gold quote mark, light text */
  .quote {
    margin-top: 18px; font-size: 25px; font-weight: 500; line-height: 1.35; color: var(--ink);
    display: flex; gap: 12px; align-items: flex-start; min-height: 34px; max-width: 540px;
  }
  .quote::before { content: "\201C"; flex: none; font-size: 46px; line-height: .9; font-weight: 500; color: var(--gold); }
  .quote.empty { visibility: hidden; }

  .posters {
    position: absolute; left: 740px; right: 0; top: 0; height: 470px;
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 78%, transparent 99%);
            mask-image: linear-gradient(to right, #000 0, #000 78%, transparent 99%);
  }
  .poster {
    position: absolute; left: 20px; top: 25px; width: 280px; height: 420px;
    border-radius: 14px; overflow: hidden; cursor: pointer; background: #12141c;
    outline: 2px solid rgba(238,240,246,0); outline-offset: 6px;
    box-shadow: 0 24px 50px -20px rgba(0,0,0,.9);
    transition: transform .6s var(--ease), width .6s var(--ease), height .6s var(--ease),
                opacity .5s var(--ease), filter .5s var(--ease), outline-color .4s var(--ease);
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Last card: "More on moviesNight" */
  .poster.more {
    background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 24px 50px -20px rgba(0,0,0,.9), inset 0 0 0 1px rgba(238,240,246,.08);
  }
  /* logo sits at the exact centre of the card; the label floats just above it */
  .poster.more span { position: absolute; z-index: 1; left: 0; right: 0; bottom: 63%; text-align: center; padding-left: .28em; font-size: 15px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--ink-dim); }
  /* lighten blend makes the banner's own dark background disappear into the card */
  .poster.more img { width: 108%; height: auto; flex: none; mix-blend-mode: lighten; }
  #rBottom { transition: opacity .2s; }
  #rBottom.hidden { visibility: hidden; }
  .poster.side { filter: brightness(.72); }
  #stage.zone-recent .poster.cur { outline-color: rgba(238,240,246,.75); }

  /* ---------- Brand banners (16:9) ---------- */
  .banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .b-yt   { background: #0f0f0f; }
  .b-yt span { font-family: Roboto, sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -1.6px; color: #fff; }
  .b-plex { background: #1f1f1f; }
  .b-plex span { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 50px; letter-spacing: -1px; color: #fff; }
  .b-cr   { background: #f47521; }
  .b-cr span { font-family: Nunito, sans-serif; font-weight: 900; font-size: 36px; color: #fff; letter-spacing: -.5px; }
  .b-tw   { background: #9146ff; }
  .b-tw span { font-family: Roboto, sans-serif; font-weight: 900; font-size: 44px; color: #fff; letter-spacing: -.5px; }
  .b-mn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Launch feedback */
  .launch {
    position: absolute; inset: 0; background: #03050c; opacity: 0; pointer-events: none; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    transition: opacity .45s var(--ease);
  }
  .launch.go { opacity: 1; }
  .launch b { font-weight: 300; font-size: 30px; }
  .launch small { font-size: 14px; color: rgba(238,240,246,.35); }

  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1 system-ui, sans-serif; color: #888; letter-spacing: .04em;
    background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 6px;
    transition: opacity 1s; z-index: 5;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="wall" id="wall"><video autoplay muted loop playsinline src="./assets/live-wallpaper.mp4"></video></div>
  <div class="shade"></div>
  <div class="dim"></div>

  <div class="clock" id="clock"></div>

  <section class="recent" id="recent" aria-label="Recently seen">
    <div class="info" id="info">
      <div>
        <div class="kicker">Recently seen</div>
        <div class="r-title" id="rTitle"></div>
        <div class="r-sub" id="rSub"></div>
      </div>
      <div id="rBottom">
        <div class="r-watched" id="rWatched"></div>
        <div class="stars" id="rStars"></div>
        <div class="quote" id="rQuote"></div>
      </div>
    </div>
    <div class="posters" id="posters"></div>
  </section>

  <div class="row" id="row"></div>
  <div class="meta"><div class="name" id="name"></div><div class="pips" id="pips"></div></div>

  <div class="launch" id="launch"><b id="launchName"></b><small id="launchPkg"></small></div>
</div>
<div class="hint" id="hint">← → move · on moviesNight press ↑ for recently seen, ↓ to go back · Enter opens</div>

<script>
const APPS = [
  { name: "YouTube", pkg: "com.google.android.youtube.tv", cls: "b-yt",
    html: `<svg width="62" height="44" viewBox="0 0 28 20"><rect width="28" height="20" rx="5.6" fill="#FF0033"/><path d="M11.2 5.6v8.8l7.6-4.4z" fill="#fff"/></svg><span>YouTube</span>` },
  { name: "Plex", pkg: "com.plexapp.android", cls: "b-plex",
    html: `<svg width="30" height="46" viewBox="0 0 14 24"><path d="M0 0h6l8 12-8 12H0l8-12z" fill="#E5A00D"/></svg><span>plex</span>` },
  { name: "Crunchyroll", pkg: "com.crunchyroll.crunchyroid", cls: "b-cr",
    html: `<svg width="48" height="48" viewBox="0 0 24 24"><defs><mask id="crm"><rect width="24" height="24" fill="#fff"/><circle cx="14.6" cy="10.4" r="6.6" fill="#000"/></mask></defs><circle cx="12" cy="12" r="11" fill="#fff" mask="url(#crm)"/><circle cx="15.6" cy="9.4" r="2.7" fill="#fff"/></svg><span>crunchyroll</span>` },
  { name: "moviesNight", pkg: "moviesNight (your app)", cls: "b-mn", recent: true,
    html: `<img src="./assets/app-moviesnight-banner.png" alt="moviesNight">` },
  { name: "Twitch", pkg: "tv.twitch.android.app", cls: "b-tw",
    html: `<svg width="44" height="48" viewBox="0 0 24 24"><path fill="#fff" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg><span>twitch</span>` },
];

/* Last 10 records from movies.juliuszlioba.com, snapshot taken 2026-11-18.
   The real launcher will fetch these live. Rating is out of 10 → shown as 5 stars. */
const RECENT = [{"title":"Marty Supreme","year":2025,"mediatype":"movie","poster":"/lYWEXbQgRTR4ZQleSXAgRbxAjvq.jpg","rating":6,"recommendation":"Story about asshole","watchedat":"2026-11-14T12:29:27.275+00:00","slug":"marty-supreme"},{"title":"Foundation","year":2021,"mediatype":"series","poster":"/tg9I5pOY4M9CKj8U0cxVBTsm5eh.jpg","rating":7,"recommendation":"Just a fine Sci-Fi","watchedat":"2026-11-10T21:06:27+00:00","slug":"foundation"},{"title":"The Odyssey","year":2026,"mediatype":"movie","poster":"/krVa7rKCQb4OBfsr2LTJv4rTz5q.jpg","rating":4,"recommendation":"Pretty bad as expected","watchedat":"2026-11-07T22:57:04+00:00","slug":"the-odyssey"},{"title":"Hope","year":2026,"mediatype":"movie","poster":"/6VY1ZKgpsc8CfGsQcCGiYEgHdH0.jpg","rating":6,"recommendation":"","watchedat":"2026-10-24T13:53:11+00:00","slug":"hope"},{"title":"Ranking of Kings","year":2021,"mediatype":"series","poster":"/ujMjMUi6z02uOfQEerEDC4rH6aG.jpg","rating":9,"recommendation":"Droped at first, but glad that revisited. Great show","watchedat":"2026-10-15T06:26:43+00:00","slug":"ranking-of-kings"},{"title":"Only the Brave","year":2017,"mediatype":"movie","poster":"/db5IkOJu9UHktrKroNktw1Z8ARY.jpg","rating":9,"recommendation":"Very good acting","watchedat":"2026-10-03T16:13:35+00:00","slug":"only-the-brave"},{"title":"The Drops of God","year":2026,"mediatype":"series","poster":"/e0HIphKTbM0YjWCASdCsjYtESHG.jpg","rating":6,"recommendation":"Quality is horible, but still finished","watchedat":"2026-09-25T18:35:05+00:00","slug":"the-drops-of-god"},{"title":"Smoking Behind the Supermarket with You","year":2026,"mediatype":"series","poster":"/t3VPDU7eLt55ghQDm3vQKhBcHZz.jpg","rating":9,"recommendation":"Cute developing love story","watchedat":"2026-09-25T16:53:58+00:00","slug":"smoking-behind-the-supermarket-with-you"},{"title":"Chainsmoker Cat","year":2026,"mediatype":"series","poster":"/kqeKlSd7o9BCbTraZsDnksRSfxm.jpg","rating":6,"recommendation":"Gross","watchedat":"2026-09-25T16:21:38+00:00","slug":"chainsmoker-cat"},{"title":"Though I Am an Inept Villainess","year":2026,"mediatype":"series","poster":"/yZHCMXL2xYS988rYxR1D8YrTzeD.jpg","rating":6,"recommendation":"Butchered adaptation","watchedat":"2026-09-21T18:03:47+00:00","slug":"though-i-am-an-inept-villainess"}];
const POSTER_BASE = "https://image.tmdb.org/t/p/w500";

const stage = document.getElementById("stage");
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

/* ---------- App row ---------- */
const row = document.getElementById("row"), pips = document.getElementById("pips");
const tiles = APPS.map((a, idx) => {
  const t = document.createElement("div");
  t.className = "tile";
  t.innerHTML = `<div class="banner ${a.cls}">${a.html}</div>`;
  t.addEventListener("mouseenter", () => { setZone("apps"); focusOn(idx); });
  t.addEventListener("click", () => { focusOn(idx); launch(); });
  row.appendChild(t);
  const p = document.createElement("div"); p.className = "pip"; pips.appendChild(p);
  return t;
});
const pipEls = [...pips.children];
const MN = APPS.findIndex(a => a.recent);

/* ---------- Recently seen ---------- */
const postersEl = document.getElementById("posters");
// The 10 records, plus a final card that opens the app itself
const ITEMS = [...RECENT, { more: true, title: "More on moviesNight" }];
const posters = ITEMS.map((r, i) => {
  const p = document.createElement("div");
  p.className = r.more ? "poster more" : "poster";
  p.innerHTML = r.more
    ? `<span>More on</span><img src="./assets/app-moviesnight-banner.png" alt="moviesNight">`
    : `<img src="${POSTER_BASE}${r.poster}" alt="${r.title}" loading="lazy">`;
  p.addEventListener("mouseenter", () => { if (cur === MN) { setZone("recent"); focusRecent(i); } });
  p.addEventListener("click", () => { if (cur === MN) { setZone("recent"); focusRecent(i); launch(); } });
  postersEl.appendChild(p);
  return p;
});

const BIG = { w: 280, h: 420 }, SMALL = { w: 210, h: 315 }, GAP = 40;
let rc = 0;
function layoutPosters() {
  posters.forEach((p, i) => {
    const d = i - rc;
    let x, size = d === 0 ? BIG : SMALL;
    if (d < 0)       x = d * (SMALL.w + GAP);                       // slid off to the left
    else if (d === 0) x = 0;
    else              x = BIG.w + GAP + (d - 1) * (SMALL.w + GAP);
    const y = (BIG.h - size.h) / 2;
    p.style.width = size.w + "px";
    p.style.height = size.h + "px";
    p.style.transform = `translate(${x}px, ${y}px)`;
    p.style.opacity = d < 0 ? 0 : 1;
    p.classList.toggle("cur", d === 0);
    p.classList.toggle("side", d !== 0);
  });
}

const MONTHS = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "June", "July", "Aug.", "Sep.", "Oct.", "Nov.", "Dec."];
const fmtDate = s => { const d = new Date(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const STAR = "M12 2.2l2.95 6.6 7.2.7-5.45 4.85 1.6 7.05L12 17.7l-6.3 3.7 1.6-7.05L1.85 9.5l7.2-.7z";
function starsHTML(rating) {
  const v = rating / 2;
  return [1, 2, 3, 4, 5].map(k => {
    const f = Math.max(0, Math.min(1, v - (k - 1)));
    const id = `sg${k}`;
    return `<svg viewBox="0 0 24 24"><defs><linearGradient id="${id}"><stop offset="${f}" stop-color="var(--gold)"/><stop offset="${f}" stop-color="transparent"/></linearGradient></defs>
      <path d="${STAR}" fill="url(#${id})" stroke="${f > 0 ? "var(--gold)" : "rgba(238,240,246,.28)"}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  }).join("");
}

const info = document.getElementById("info");
let infoTimer;
function renderInfo(animate) {
  const r = ITEMS[rc];
  const apply = () => {
    document.getElementById("rTitle").textContent = r.title;
    document.getElementById("rBottom").classList.toggle("hidden", !!r.more);
    if (r.more) {
      document.getElementById("rSub").textContent = "Everything I recently watched, rated and reviewed";
      info.classList.remove("swap");
      return;
    }
    document.getElementById("rSub").textContent = `${r.year} · ${r.mediatype[0].toUpperCase() + r.mediatype.slice(1)}`;
    document.getElementById("rWatched").textContent = `Watched ${fmtDate(r.watchedat)}`;
    document.getElementById("rStars").innerHTML = starsHTML(r.rating);
    const q = document.getElementById("rQuote");
    q.textContent = r.recommendation.trim();
    q.classList.toggle("empty", !r.recommendation.trim());
    info.classList.remove("swap");
  };
  clearTimeout(infoTimer);
  if (animate) { info.classList.add("swap"); infoTimer = setTimeout(apply, 180); } else apply();
}
function focusRecent(n) {
  n = Math.max(0, Math.min(ITEMS.length - 1, n));
  if (n === rc) return;
  rc = n; layoutPosters(); renderInfo(true);
}

/* ---------- Focus / zones ---------- */
let zone = "apps";
function setZone(z) {
  zone = z;
  stage.classList.toggle("zone-recent", z === "recent");
}

const nameEl = document.getElementById("name"), wall = document.getElementById("wall");
let cur = -1;
function focusOn(n) {
  n = Math.max(0, Math.min(APPS.length - 1, n));
  if (n === cur) return;
  cur = n;
  tiles.forEach((t, i) => t.classList.toggle("on", i === cur));
  pipEls.forEach((p, i) => p.classList.toggle("on", i === cur));
  nameEl.classList.add("swap");
  setTimeout(() => { nameEl.textContent = APPS[cur].name; nameEl.classList.remove("swap"); }, 220);
  wall.style.transform = `translateX(${(2 - cur) * 14}px)`;

  const showRecent = cur === MN;
  if (showRecent && !stage.classList.contains("recent-on")) { rc = 0; layoutPosters(); renderInfo(false); }
  stage.classList.toggle("recent-on", showRecent);
}

/* ---------- Launch ---------- */
const launchEl = document.getElementById("launch");
function launch() {
  const item = zone === "recent" && cur === MN ? ITEMS[rc] : null;
  const title = item && !item.more;   // a specific title; the "More" card opens the app itself
  document.getElementById("launchName").textContent = title ? item.title : APPS[cur].name;
  document.getElementById("launchPkg").textContent = title ? `moviesNight · /${item.slug}` : APPS[cur].pkg;
  launchEl.classList.add("go");
  setTimeout(() => launchEl.classList.remove("go"), 1400);
}

/* ---------- Remote / keyboard ---------- */
addEventListener("keydown", e => {
  const k = e.key;
  if (zone === "apps") {
    if (k === "ArrowRight") focusOn(cur + 1);
    else if (k === "ArrowLeft") focusOn(cur - 1);
    else if (k === "ArrowUp" && cur === MN) setZone("recent");
    else if (k === "Enter" || k === " ") launch();
    else return;
  } else {
    if (k === "ArrowRight") focusRecent(rc + 1);
    else if (k === "ArrowLeft") focusRecent(rc - 1);
    else if (k === "ArrowDown" || k === "Escape" || k === "Backspace") setZone("apps");
    else if (k === "Enter" || k === " ") launch();
    else if (k === "ArrowUp") {}
    else return;
  }
  e.preventDefault();
});

/* ---------- Clock ---------- */
const clock = document.getElementById("clock");
let last = "";
function tick() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const s = `${p(d.getHours())}<span class="colon">:</span>${p(d.getMinutes())}`;
  if (s !== last) { clock.innerHTML = s; last = s; }
}
tick(); setInterval(tick, 1000);

/* Start focus: "#3" opens on moviesNight, "#3r2" also selects the 3rd poster (handy for previews) */
const m = location.hash.match(/^#(\d)(?:r(\d+))?/);
focusOn(m ? +m[1] : 0);
if (m && m[2] !== undefined && cur === MN) { setZone("recent"); focusRecent(+m[2]); }

setTimeout(() => document.getElementById("hint").style.opacity = 0, 7000);
</script>
</body>
</html>
